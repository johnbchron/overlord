[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
overlord-core = { path = "crates/overlord-core" }
overlord-expr = { path = "crates/overlord-expr" }
overlord-store = { path = "crates/overlord-store" }
overlord-connect = { path = "crates/overlord-connect" }
overlord-connector-fixture = { path = "crates/overlord-connector-fixture" }
overlord-connector-gworkspace = { path = "crates/overlord-connector-gworkspace" }
overlord-engine = { path = "crates/overlord-engine" }
overlord-web = { path = "crates/overlord-web" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
jiff = { version = "0.2", features = ["serde"] }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled", "blob"] }
rusqlite_migration = "2"
blake3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
ulid = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
url = "2"
toml = "0.9"
proptest = "1"
axum = { version = "0.8", features = ["macros"] }
maud = { version = "0.27", features = ["axum"] }
tower = "0.5"
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "rust_crypto"] }
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
