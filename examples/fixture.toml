# A local demo against the fixture connector: no credentials, no network.
#
#   cargo run -- -c examples/fixture.toml checks import examples/starter-checks.json
#   cargo run -- -c examples/fixture.toml checks dry-run mfa-missing
#   cargo run -- -c examples/fixture.toml checks enable mfa-missing
#   cargo run -- -c examples/fixture.toml sweep
#   cargo run -- -c examples/fixture.toml violations
#
# Then the operator UI, on http://127.0.0.1:8080:
#
#   cargo run -- -c examples/fixture.toml serve --dev-actor you
#
# `--dev-actor` authenticates nobody and refuses to bind anything but a
# loopback address. A real deployment configures [auth] below instead.

[server]
bind = "127.0.0.1:8080"

[store]
path = "overlord.db"

[sweep]
absence_guard_pct = 10

# Entity types that are not people (SPEC.md section 6.4).
#
# Every unlinked entity is otherwise evaluated as an implicit singleton
# person, which is what lets orphan-account checks fire before any
# linking has happened. A handset is not an orphan account: naming its
# type here keeps a fleet of them off the Users roster and out of
# person-scoped checks, while entity-scoped checks over them are
# untouched.
#
# Editing this appends an `identity.policy` command on the next run, so
# evaluation reads the stream rather than this file and a replay stays
# exact. The change takes effect at the next sweep, which also resolves
# the violations it orphans.
[identity]
non_person_entity_types = []

# Uncomment for real authentication (SPEC.md section 14). The client
# secret comes from OVERLORD_OIDC_CLIENT_SECRET and never from this file.
# Set OVERLORD_SESSION_KEY to 64 hex characters so sessions survive a
# restart. Authentication alone is not sufficient: without
# `allowed_subjects` or `required_group`, overlord refuses to start.
#
# [auth]
# issuer           = "https://id.example.com"
# client_id        = "overlord"
# redirect_url     = "https://overlord.example.com/auth/callback"
# allowed_subjects = ["you@example.com"]
# required_group   = "secops"

[[systems]]
id = "gws-prod"
connector = "fixture"
config = { path = "fixtures/baseline.json", stage = 0 }

[[systems]]
id = "okta-prod"
connector = "fixture"
config = { path = "fixtures/idp.json", stage = 0 }
