[package]
name = "overlord-connector-gworkspace"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Read-only Google Workspace connector for overlord"

[dependencies]
overlord-core.workspace = true
overlord-connect.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# RS256, for the self-signed assertion a service account exchanges for a
# token. The pure-Rust backend is chosen deliberately: the default one
# needs a C toolchain, and overlord builds from a nix devshell with no
# such thing in it.
jsonwebtoken = { workspace = true }

[dev-dependencies]
tokio.workspace = true
wiremock.workspace = true

[lints]
workspace = true
